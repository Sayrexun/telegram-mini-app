<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель</title><link rel="stylesheet" href="admin.css"></head>
<body><div class="layout"><aside class="sidebar"><div class="brand"><div class="logo">K</div><div><b>Каталог</b><small>Admin</small></div></div><nav><button class="nav active" data-page="dashboard">📊 <span>Главная</span></button><button class="nav" data-page="products">📦 <span>Товары</span></button><button class="nav" data-page="categories">📂 <span>Категории</span></button><button class="nav" data-page="requests">📝 <span>Заявки</span><i id="newBadge">0</i></button><button class="nav" data-page="users">👥 <span>Пользователи</span></button><button class="nav" data-page="settings">⚙️ <span>Настройки</span></button></nav><button id="logout" class="logout">↪ Выйти</button></aside>
<main class="main"><header><div><div class="muted">Панель управления</div><h1 id="pageTitle">Главная</h1></div><button id="refresh" class="ghost">↻ Обновить</button></header>
<section id="dashboard" class="page active"><div class="stats"><div class="stat"><span>Товары</span><b id="sProducts">0</b></div><div class="stat"><span>Активные</span><b id="sActive">0</b></div><div class="stat"><span>Пользователи</span><b id="sUsers">0</b></div><div class="stat accent"><span>Новые заявки</span><b id="sNew">0</b></div><div class="stat"><span>Всего заявок</span><b id="sRequests">0</b></div><div class="stat"><span>Сумма заявок</span><b id="sTotal">0 zł</b></div></div><div class="panel"><div class="panel-head"><h2>Последние заявки</h2><button class="link" onclick="showPage('requests')">Все заявки →</button></div><div id="recentRequests" class="table-wrap"></div></div></section>
<section id="products" class="page"><div class="toolbar"><h2>Товары</h2><button class="primary" id="addProductBtn">+ Добавить товар</button></div><div class="panel"><div id="productsTable" class="table-wrap"></div></div></section>
<section id="categories" class="page"><div class="toolbar"><h2>Категории</h2><div class="inline"><input id="categoryName" placeholder="Название категории"><button class="primary" id="addCategory">Добавить</button></div></div><div class="panel"><div id="categoriesTable" class="table-wrap"></div></div></section>
<section id="requests" class="page"><div class="toolbar"><h2>Заявки</h2><select id="statusFilter"><option value="">Все статусы</option><option value="new">Новые</option><option value="processing">В обработке</option><option value="completed">Выполнены</option><option value="cancelled">Отменены</option></select></div><div class="panel"><div id="requestsTable" class="table-wrap"></div></div></section>
<section id="users" class="page"><div class="toolbar"><h2>Пользователи</h2><input id="userSearch" placeholder="Поиск по имени, username или ID"></div><div class="panel"><div id="usersTable" class="table-wrap"></div></div></section>
<section id="settings" class="page"><div class="panel settings"><h2>Настройки</h2><p class="muted">Ключ администратора хранится только в браузере и отправляется серверу для доступа к API.</p><label>ADMIN_KEY<input id="adminKey" type="password" placeholder="Введите ключ"></label><button class="primary" id="saveKey">Сохранить ключ</button><div id="keyStatus" class="muted"></div></div></section>
</main></div><div id="modal"></div><script src="admin.js?v=5"></script></body></html>
