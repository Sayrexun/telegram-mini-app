<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog Admin</title><link rel="stylesheet" href="admin.css"></head>
<body>
<h1>Админ-панель</h1>
<div id="login"><input id="key" type="password" placeholder="Admin key"><button onclick="login()">Войти</button></div>
<section id="panel" hidden>
  <div class="form">
    <input id="name" placeholder="Название товара">
    <input id="category" placeholder="Категория">
    <input id="price" type="number" step="0.01" placeholder="Цена">
    <input id="image" placeholder="URL изображения">
    <textarea id="description" placeholder="Описание"></textarea>
    <button onclick="save()">Добавить товар</button>
  </div>
  <h2>Товары</h2><div id="list"></div>
</section>
<script src="admin.js"></script>
</body></html>
