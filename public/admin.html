<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель</title><link rel="stylesheet" href="admin.css"></head><body><div class="layout"><aside><h2>Админ-панель</h2><button data-tab="products" class="active">📦 Товары</button><button data-tab="categories">📂 Категории</button><button data-tab="requests">📝 Заявки</button><button data-tab="users">👥 Пользователи</button></aside><main><section id="products" class="tab"><h1>Товары</h1><form id="productForm"><input name="name" placeholder="Название товара" required><input name="category" placeholder="Категория" required><input name="price" type="number" step="0.01" placeholder="Цена" required><input name="image" placeholder="URL изображения"><textarea name="description" placeholder="Описание"></textarea><input name="variants" placeholder="Варианты через запятую"><button>Добавить товар</button></form><div id="productList"></div></section><section id="categories" class="tab hidden"><h1>Категории</h1><form id="categoryForm"><input name="name" placeholder="Название категории" required><button>Добавить категорию</button></form><div id="categoryList"></div></section><section id="requests" class="tab hidden"><h1>Заявки</h1><div id="requestList"></div></section><section id="users" class="tab hidden"><h1>Пользователи</h1><div id="userList"></div></section></main></div><script src="admin.js"></script></body></html>
