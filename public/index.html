<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08070c">
  <title>Каталог — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">K</div>
        <div><strong>Каталог</strong><span>Mini App</span></div>
      </div>

      <nav class="side-nav">
        <button class="side-link active" data-side="home"><span>⌂</span>Главная</button>
        <button class="side-link" data-side="catalog"><span>▦</span>Каталог</button>
        <button class="side-link" data-side="new"><span>✦</span>Новинки</button>
        <button class="side-link" data-side="popular"><span>☆</span>Популярные</button>
        <button class="side-link" data-side="accessories"><span>◇</span>Аксессуары</button>
      </nav>

      <div class="side-note">
        <b>Быстрый поиск</b>
        <span>Найди нужный товар за несколько секунд</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="mobile-brand"><div class="brand-mark">K</div><strong>Каталог</strong></div>
        <div class="search">
          <span>⌕</span>
          <input id="search" placeholder="Поиск по товарам..." autocomplete="off">
        </div>
        <button class="lang" id="lang"><span>RU</span><i>⌄</i></button>
        <button class="cart-btn" id="cart" aria-label="Корзина">🛒<b id="cartCount">0</b></button>
      </header>

      <section class="hero">
        <div class="hero-copy">
          <span class="eyebrow">КАТАЛОГ</span>
          <h1>Всё нужное<br><em>в одном месте</em></h1>
          <p>Компактный каталог с быстрым поиском, категориями и удобными карточками товаров.</p>
          <button class="hero-btn" id="heroCatalog">Перейти к товарам <span>→</span></button>
        </div>
        <div class="hero-art">
          <div class="orb orb-a"></div>
          <div class="orb orb-b"></div>
          <div class="hero-grid"></div>
        </div>
      </section>

      <div class="categories" id="categories"></div>

      <div class="section-head">
        <div>
          <span class="section-kicker">КАТАЛОГ</span>
          <h2 id="sectionTitle">Популярные товары</h2>
        </div>
        <button class="view-all" id="viewAll">Смотреть все →</button>
      </div>

      <section id="catalog"></section>
    </main>
  </div>

  <div id="toast" role="status"></div>
  <script src="app.js?v=5"></script>
</body>
</html>
